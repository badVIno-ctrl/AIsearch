# Удобный запуск через docker compose.
# Поменяй путь слева от двоеточия на свою папку с фото и выполни:
#     docker compose up --build
# Затем открой http://127.0.0.1:5000

services:
  vision-search:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Слева — твоя папка с картинками на компьютере.
      - ./images:/app/images
      # Чтобы кэш векторов и скачанные модели не пропадали между запусками.
      - ./.cache:/app/.cache
      - ./models:/app/models
    environment:
      - NO_BROWSER=1
